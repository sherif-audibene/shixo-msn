# Monit checks for shixo-msn (clipsrv). Installed to /etc/monit/conf.d/shixo-msn.conf by the Jenkins deploy.
# Alerts go through /usr/local/bin/monit-alert (installed by the ytdl deploy), since no SMTP server is configured.

check process shixo-msn with pidfile /var/run/shixo-msn.pid
  start program = "/etc/init.d/shixo-msn start" with timeout 60 seconds
  stop program = "/etc/init.d/shixo-msn stop" with timeout 30 seconds
  if does not exist for 2 cycles then restart
  if does not exist for 2 cycles then exec "/usr/local/bin/monit-alert"
    else if succeeded then exec "/usr/local/bin/monit-alert"
  # /api/health is unauthenticated and returns the literal string "ok"
  if failed host 127.0.0.1 port 6303 protocol http request "/api/health" content = "ok" for 2 cycles then restart
  if failed host 127.0.0.1 port 6303 protocol http request "/api/health" content = "ok" for 2 cycles then exec "/usr/local/bin/monit-alert"
    else if succeeded then exec "/usr/local/bin/monit-alert"
  if 3 restarts within 10 cycles then exec "/usr/local/bin/monit-alert"
